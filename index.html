<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="你是被骗进山里的新娘。第六天夜里，一个小孩敲响了你的窗户。">
<meta name="theme-color" content="#0b0a09">
<title>无面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* 版式：整屏铺一张褪色的老照片当背景，上面压一页深色的纸，纸上是这一节的字和选项。
   只做一种暗色：这是一个夜里的故事，不跟着系统切亮色。 */
:root {
  --paper: rgba(14, 12, 10, 0.86);
  --ink: #e9e2d4;
  --muted: #a39a8a;
  --rule: rgba(233, 226, 212, 0.16);
  --red: #b8392b;
  --brass: #c9a25a;
  --font-title: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
  --font-body: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #0b0a09; }
body { margin: 0; background: #0b0a09; color: var(--ink); font-family: var(--font-body); font-size: 17.5px; line-height: 1.95; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

#bg { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; transition: opacity .5s ease; }
#bg.fade { opacity: 0; transition: none; }
.app {
  position: relative; z-index: 1; max-width: 640px; margin: 0 auto; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px; min-height: 100vh;
}

/* 顶部状态条 */
.hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin: 0 -16px; padding: 10px 16px;
  background: linear-gradient(rgba(8,7,6,0.92), rgba(8,7,6,0.78)); border-bottom: 1px solid var(--rule);
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 14px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: #080706; z-index: 10; }
.clock { font-family: var(--font-mono); font-size: 20px; letter-spacing: .04em; }
.clock small { font-size: 12.5px; color: var(--muted); margin-left: 6px; letter-spacing: 0; font-family: var(--font-body); }
.clock.late { color: var(--red); }
.noise { display: flex; align-items: center; gap: 4px; color: var(--muted); }
.noise i { width: 10px; height: 12px; border-radius: 5px 5px 2px 2px; background: rgba(201,162,90,0.18); display: inline-block; }
.noise i.on { background: var(--brass); box-shadow: 0 0 8px rgba(201,162,90,0.8); }
.noise.hot i.on { background: #e0603f; box-shadow: 0 0 10px rgba(224,96,63,0.9); }
.tools { margin-left: auto; display: flex; gap: 6px; }
.tool { background: rgba(255,255,255,0.04); border: 1px solid var(--rule); border-radius: 6px; padding: 3px 10px; font-size: 13.5px; color: var(--muted); }
.tool:hover { color: var(--ink); border-color: rgba(233,226,212,0.35); }
.tool:disabled { opacity: .35; cursor: default; }

/* 照片区 */
.photo { height: 36vh; min-height: 200px; display: flex; align-items: flex-end; padding-bottom: 12px; }
.cap { font-family: var(--font-mono); font-size: 12.5px; color: rgba(233,226,212,0.75); letter-spacing: .12em; text-shadow: 0 1px 3px #000; }
.cap b { font-family: var(--font-title); font-weight: 400; font-size: 26px; letter-spacing: .1em; margin-left: 8px; color: var(--ink); }

/* 纸 */
.page {
  background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 20px 18px 22px;
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); box-shadow: 0 20px 60px -20px #000;
}
.with { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; font-size: 13.5px; color: var(--muted); align-items: center; }
.with span { border: 1px solid var(--rule); border-radius: 999px; padding: 1px 10px; }
.with .wrist { border-color: rgba(184,57,43,0.6); color: #e1a598; }
.note { margin: 0 0 18px; padding: 2px 0 2px 14px; border-left: 2px solid var(--red); color: #cfc5b3; }
.note p, .txt p { margin: 0 0 14px; }
.note p:last-child, .txt p:last-child { margin-bottom: 0; }
.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
.choice {
  display: grid; grid-template-columns: 1.6em 1fr; gap: 6px; text-align: left; line-height: 1.6;
  background: rgba(255,255,255,0.03); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px;
}
.choice:hover { border-color: rgba(201,162,90,0.7); background: rgba(201,162,90,0.06); }
.choice .k { font-family: var(--font-mono); color: var(--brass); }

/* 开始页和结局 */
.start { min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; padding-bottom: 40px; box-sizing: border-box; }
.start h1, .end-title { font-family: var(--font-title); font-weight: 400; margin: 0; line-height: 1; letter-spacing: .12em; text-shadow: 0 2px 18px #000; }
.start h1 { font-size: clamp(84px, 26vw, 150px); }
.start .sub { margin: 0; color: #d6cdbd; text-shadow: 0 1px 6px #000; }
.warn { margin: 0; font-size: 13.5px; color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.primary { background: var(--red); border: 0; border-radius: 4px; padding: 12px 26px; font-size: 17px; letter-spacing: .1em; }
.primary:hover { filter: brightness(1.12); }
.ghost { background: rgba(0,0,0,0.35); border: 1px solid var(--rule); border-radius: 4px; padding: 11px 20px; }
.album h3 { margin: 0 0 8px; font-size: 13.5px; color: var(--muted); font-weight: 400; letter-spacing: .1em; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.slot { border: 1px dashed var(--rule); border-radius: 3px; padding: 3px 10px; font-size: 14px; color: var(--muted); background: rgba(0,0,0,0.35); }
.slot.got { border-style: solid; border-color: rgba(201,162,90,0.6); color: var(--ink); }
.end-num { margin: 0 0 6px; font-family: var(--font-mono); font-size: 13px; color: var(--brass); letter-spacing: .14em; }
.end-title { font-size: 56px; margin-bottom: 18px; }
.end-foot { margin-top: 22px; display: flex; flex-direction: column; gap: 16px; }
.real { font-size: 13px; color: var(--muted); margin: 0; }

/* 线索本 */
.drawer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 70vh; overflow-y: auto;
  background: #11100e; border-top: 1px solid var(--rule); box-shadow: 0 -20px 50px #000;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.drawer-in { max-width: 640px; margin: 0 auto; }
.drawer h2 { margin: 0 0 4px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
.drawer .hint { margin: 0 0 14px; font-size: 13.5px; color: var(--muted); }
.drawer ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 10px; font-size: 15.5px; line-height: 1.7; }

@media (prefers-reduced-motion: reduce) { #bg { transition: none; } }
</style>
</head>
<body>
<canvas id="bg" role="img" aria-label="这一节的场景照片"></canvas>
<div class="app" id="app">
  <section class="start" id="start" hidden>
    <h1>无面</h1>
    <p class="sub">你是被骗进山里的新娘。第六天夜里，一个小孩敲响了你的窗户。<br>天亮前走到石门镇，头班车六点十分。</p>
    <p class="warn">含拐卖、邪神崇拜和惊吓情节。故事、人物和地名均为虚构。</p>
    <div class="btns">
      <button class="primary" type="button" data-new>开始</button>
      <button class="ghost" type="button" data-resume hidden>接着上次</button>
    </div>
    <div class="album" id="album"></div>
  </section>

  <section id="game" hidden>
    <header class="hud" id="hud"></header>
    <div class="photo"><div class="cap" id="cap"></div></div>
    <article class="page" id="page" aria-live="polite"></article>
  </section>
</div>
<div class="drawer" id="drawer" hidden></div>
<script>
/*CORE-START*/
const Story = (() => {
  'use strict';

  // ---- 暗规矩（不显示给玩家）----
  // 1. 新娘左手的红绳是祠堂里系的。系着它的人走近铜铃，铃就响；村里人和开过脸的女人不会让铃响。
  // 2. 红绳碰了铁，全村的铃一起响。用祠堂长明灯的火烧，它整根掉下来，铃从此不认得你。
  // 3. 开过脸的女人，脸印在白布上，挂在“奶奶”身后的墙上。烧掉那块布，她就想起自己是谁。
  // 4. 开过脸的女人听见铃声会走过去，把人带回祠堂。
  // 5. 阿芸是村长的女儿，扮成被关的新娘。她的红绳是自己系的，铃不会为她响。
  // 6. 头班车 06:10 从石门镇开。村里的动静到了 2，村里人会骑摩托先去车站堵人。

  const BUS = 370; // 06:10，从零点算的分钟数
  const CLUES = {
    r1: '冯婆说：红绳碰不得铁，碰了，全村都知道。',
    r2: '冯婆进进出出，门口的铃从来不响。只有你一过，它就“叮”一声。',
    r3: '头班车早上六点十分，从石门镇开。',
    r4: '豆子说：红绳得用奶奶灯里的火烧，一烧就掉，铃就不认得你了。',
    r5: '豆子说：开过脸的人，脸都挂在祠堂里，奶奶背后那面墙上。',
    r6: '豆子说：出村往后山，坟地后头的豁口叫鸦口，过了鸦口是鹰嘴崖栈道，绳子都是老麻绳。',
    r7: '春妮掀开地窖盖子，看了豆子一眼，唱了半句歌，又把盖子合上了。开过脸的人，心里好像还剩一点。',
    c1: '你推开柴房门，门上的铃响了。阿芸跟着跨出门槛，铃一动不动。',
    c2: '阿芸叫豆子“豆豆”。豆子说，这个小名只有他娘这么叫过。',
    c3: '阿芸说她是省城读会计的大学生。她手掌上全是老茧，指甲缝里是黑泥，左手拇指上有一道镰刀疤。',
    c4: '还没人告诉过阿芸那个豁口叫什么，她自己先说了一句：“到鸦口了。”',
    c5: '在祠堂里，阿芸不肯把手腕凑到灯上，说怕疼。',
    c6: '秦姐说：新娘抬进村，她两年里个个都见过，没见过阿芸。',
    c7: '在守林屋门口，阿芸一脚踢翻了狗盆。',
    c8: '阿芸的红绳凑到灯上，烧起来跟普通棉线一样，一股焦味，烫得她直叫。你的绳子烧的时候是凉的。',
    c9: '阿芸一个人从坟堆中间走过去，坟头的铃一个都没响。',
  };

  const N = {};
  const node = (id, def) => { N[id] = { id, ...def }; };
  const P = (...xs) => xs.filter(Boolean).join('\n\n');
  const clue = (s, k) => { if (!s.clues.includes(k)) s.clues.push(k); };
  const w = (s, k) => Boolean(s.w[k]);
  const hhmm = (t) => `${String(Math.floor(t / 60) % 24).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
  const ring = (s, n = 1) => { s.alarm = Math.min(3, s.alarm + n); s.rang += 1; };
  // 身上还系着真红绳的人：你（没烧没剪时）和秦姐
  const ringers = (s) => (s.string === 'on' ? 1 : 0) + (w(s, 'qin') ? 1 : 0);

  // ---- No.01 ----
  node('01', {
    title: '窗外', bg: 'room',
    enter: (s) => { clue(s, 'r1'); clue(s, 'r2'); clue(s, 'r3'); },
    text: () => P(
      '你醒过来的时候，屋顶上有一只蜘蛛，在同一个地方结了六天的网。',
      '六天前，你还在县城的汽车站。介绍工作的女人说，山里新开了一家民宿，缺个前台，包吃住，一个月六千。她给你买了瓶水。你喝了半瓶，后面的事就记不清了。',
      '再睁眼，你就在这间屋里了。土墙，木窗，窗上钉着六根铁条。买你的人叫冯有贵，四十多岁，不怎么说话，看你的眼神像看一头刚牵回来的牛。',
      '第一天，他娘冯婆在你左手腕上系了一根红绳，系得很紧，勒进了肉里。她一边系一边念叨：“拴住了就是冯家的人。铁碰不得，碰了，全村都知道。”',
      '这个村叫石瓮村。家家门口挂着一只铜铃，路口挂，井边挂，连茅房门上都挂。冯婆进进出出，门口的铃从来不响。只有你一过，它就“叮”的一声。',
      '村子最里头有座祠堂，供着一尊木像：穿红袄的老太太，双手搭在膝盖上，脸上什么都没有。不是没刻，是被削平了，平得像一块磨过的木板。村里人都叫她“奶奶”。',
      '隔壁每天下午有个女人坐在门口剥豆子，三十来岁，很瘦，一直在笑，嘴里哼着一支你听不懂的调子。冯婆说，那是春妮，“开过脸了，乖得很”。',
      '“你明天晚上也开。”冯婆把饭碗放下，难得笑了一下，“开了脸，就不想家了。”',
      '今天是第六天晚上。',
      '半夜，窗户被轻轻敲了三下。窗外蹲着一个小男孩，八九岁，瘦得像根竹竿，脸上全是泥。是春妮的儿子，大家都叫他豆子。他从铁条缝里塞进来一把生锈的钥匙。',
      '“姐姐，我带你走。”他的声音抖得厉害，“天亮前要走到石门镇，头一班车六点十分。铃铛一响，全村都醒。”',
      '他回头看了一眼，又小声加了一句：“柴房里还关着一个姐姐，哭了三天了。”',
    ),
    choices: [
      { label: '用钥匙开门，马上跟豆子走', go: (s) => { s.t += 5; return '03'; } },
      { label: '先问豆子：你为什么要帮我？', go: (s) => { s.t += 5; return '02'; } },
      { label: '摸到灶台拿把剪刀，先把红绳剪了', go: (s) => { s.t += 5; return '04'; } },
      { label: '让豆子先带你去柴房，把那个姐姐一起救出来', go: (s) => { s.t += 15; return '06'; } },
    ],
  });

  // ---- No.02 ----
  node('02', {
    title: '豆子的娘', bg: 'room',
    enter: (s) => { clue(s, 'r4'); clue(s, 'r5'); clue(s, 'r6'); },
    text: () => P(
      '豆子低着头，抠着窗台上的泥。',
      '“我娘以前会唱歌。”他说，“篱笆开花一朵朵，阿妈在河那边坐……她说那是她老家的歌。她天天唱，唱完就哭。”',
      '“我五岁那年，她开了脸。开完就不唱了，也不哭了，天天笑。她喊我‘小孩’，跟喊别人家的小孩一样。”',
      '“她的脸挂在祠堂里。奶奶背后那面墙，一块一块的白布，都是脸。”',
      '他抬起头，眼睛亮得吓人：“红绳不能拿剪子剪，一剪，全村的铃都响。奶奶灯里的火能烧，一烧就掉，铃就不认得你了。我偷看过。”',
      '“出村往后山走，坟地后头有个豁口叫鸦口。过了鸦口是鹰嘴崖，崖上有条栈道，绳子都是老麻绳。下去就是石门镇。我送你到镇上。”',
    ),
    choices: [
      { label: '开门，先去祠堂把红绳烧了', go: (s) => { s.t += 20; return '08'; } },
      { label: '开门，直接往村外走', go: (s) => { s.t += 5; return '03'; } },
      { label: '先去柴房，把那个姐姐救出来', go: (s) => { s.t += 15; return '06'; } },
    ],
  });

  // ---- No.03 ----
  node('03', {
    title: '出门', bg: 'village',
    text: (s) => P(
      '门轴“吱”了一声。你屏住呼吸，等了很久，冯家没有动静。',
      '村道是黄泥的，白天被太阳晒裂，夜里又被露水泡软。每户门口那只铜铃在月光底下发着暗光，像一排睁着的眼睛。远处祠堂的灯一动不动。',
      s.string === 'on'
        ? '豆子拉着你贴在墙根：“大路近，可家家门口都挂着铃。屋后的水沟绕得远，铃少，就是得蹚泥。村口有村长守着，别往那儿去。”'
        : '你手腕上的红绳已经没了。豆子说：“现在铃不认得你了。大路近，屋后的水沟绕。村口有村长守着，别往那儿去。”',
      w(s, 'ayun') ? '阿芸紧紧攥着你的衣角，一直在发抖。' : '',
    ),
    choices: [
      { label: '跟豆子走屋后的水沟', go: (s) => { s.t += 40; return '13'; } },
      { label: '走大路，抄近道上后山', go: (s) => { s.t += 15; if (s.string === 'on') { ring(s, 2); return '12'; } return '15'; } },
      { label: '先去祠堂', when: (s) => !s.seen.includes('08') && s.alarm < 3, go: (s) => { s.t += 20; return '08'; } },
      { label: '先去柴房救人', when: (s) => !s.seen.includes('06'), go: (s) => { s.t += 15; return '06'; } },
    ],
  });

  // ---- No.04 ----
  node('04', {
    title: '剪刀', bg: 'alarm',
    enter: (s) => { s.string = 'cut'; s.alarm = 3; s.rang += 1; },
    text: () => P(
      '你在黑暗里摸到灶台，摸到一把冰凉的剪刀。',
      '剪刀刃碰到红绳的那一下，你听见了一声“叮”。',
      '不是一只铃。是全村的铃，一起。',
      '那声音像一面墙一样压过来。门口的、井边的、路口的、茅房的，几百只铃同时在响，响得你牙根发酸。红绳断了，断口烫得像烙铁，在你手腕上留下一圈红印。',
      '一家接一家的窗户亮了。门开了。从每一扇门里，走出来一个女人。光着脚，头发披着，嘴里哼着同一支调子，脸上都带着一样的笑。她们一齐转过头，朝冯家的方向走过来。',
      '冯婆在屋里尖叫：“跑了——！”',
      '豆子一把拽住你的手：“这边！”',
    ),
    choices: [
      { label: '跟豆子钻进后院的红薯窖', go: (s) => { s.t += 45; return '05'; } },
      { label: '往后山坟地跑', go: (s) => { s.t += 25; return '15'; } },
      { label: '冲去柴房，把那个姐姐也带上', go: (s) => { s.t += 10; return '06'; } },
    ],
  });

  // ---- No.05 ----
  node('05', {

  const ENDING_ORDER = ['E1', 'E2', 'E3', 'E4', 'E5', 'E6'];

  // ---- 对外接口 ----
  function enter(s, id) {
    s.from = s.node;
    s.node = id;
    if (!s.seen.includes(id)) s.seen.push(id);
    if (N[id].enter) N[id].enter(s);
  }
  function endGame(s, id) {
    const e = E[id];
    s.ending = { id, num: e.num, title: e.title, tag: e.tag, text: e.text(s), t: s.t };
  }
  const visible = (s, n) => n.choices.filter((c) => !c.when || c.when(s));
  function newGame() {
    const s = {
      v: 1, node: '', from: '', t: 10, alarm: 0, rang: 0, dinged: false, string: 'on',
      f: {}, w: { dou: true }, clues: [], seen: [], note: '', ending: null, endWhy: '', exposed: false, hist: [],
    };
    enter(s, '01');
    return s;
  }
  function view(s) {
    if (s.ending) return { mode: 'ending', ...s.ending };
    const n = N[s.node];
    return {
      mode: 'node', id: n.id, title: n.title, bg: n.bg, note: s.note,
      text: typeof n.text === 'function' ? n.text(s) : n.text,
      choices: visible(s, n).map((c) => c.label),
    };
  }
  function choose(s, i) {
    if (s.ending) return;
    const c = visible(s, N[s.node])[i];
    if (!c) return;
    s.hist.push(JSON.stringify({ ...s, hist: [] }));
    if (s.hist.length > 60) s.hist.shift();
    const rang = s.rang;
    s.note = '';
    const next = c.go(s);
    if (next[0] === 'E') endGame(s, next);
    else enter(s, next);
    s.dinged = s.rang > rang;
  }
  // 退一步：回到上一个选择之前
  function undo(s) {
    if (!s.hist.length) return s;
    const prev = JSON.parse(s.hist[s.hist.length - 1]);
    prev.hist = s.hist.slice(0, -1);
    prev.dinged = false;
    return prev;
  }
  const bgOf = (s) => (s.ending ? endBg(s.ending.id) : N[s.node].bg);
  const endBg = (id) => ({ E1: 'dawn', E2: 'town', E3: 'shrine', E4: 'masks', E5: 'town', E6: 'fire' }[id]);

  return { newGame, view, choose, undo, hhmm, bgOf, BUS, CLUES, ENDINGS: E, ENDING_ORDER, N };
})();
globalThis.Story = Story;

<script>

// 背景“老照片”：每个场景用 canvas 画一张，再做褪色、颗粒、划痕和暗角
const Art = (() => {
  function rng(seed) {
    let t = seed >>> 0;
    return () => {
      t = (t + 0x6d2b79f5) >>> 0;
      let x = Math.imul(t ^ (t >>> 15), t | 1);
      x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }
  const hash = (str) => [...str].reduce((a, c) => Math.imul(a ^ c.charCodeAt(0), 16777619) >>> 0, 2166136261);
  let grainTile = null;
  function grain() {
    if (grainTile) return grainTile;
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const g = c.getContext('2d'), img = g.createImageData(180, 180);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 46;
    }
    g.putImageData(img, 0, 0);
    grainTile = c;
    return c;
  }

  // ---- 画画用的小零件 ----
  function vgrad(g, w, h, stops, y0 = 0, y1 = h) {
    const gr = g.createLinearGradient(0, y0, 0, y1);
    stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c));
    g.fillStyle = gr;
    g.fillRect(0, y0, w, y1 - y0);
  }
  function glow(g, x, y, r, color, a = 1) {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, color);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalAlpha = a;
    g.fillStyle = gr;
    g.fillRect(x - r, y - r, r * 2, r * 2);
    g.globalAlpha = 1;
  }
  function moon(g, x, y, r) {
    glow(g, x, y, r * 5, 'rgba(210,225,230,0.28)');
    g.fillStyle = '#dfe6e3';
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }
  function ridge(g, w, base, amp, color, R, step = 8) {
    const p = R() * 9, f = 0.004 + R() * 0.006;
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(0, 9999);
    for (let x = 0; x <= w + step; x += step) g.lineTo(x, base - Math.abs(Math.sin(x * f + p)) * amp - Math.sin(x * f * 3.1 + p) * amp * 0.25);
    g.lineTo(w + step, 9999);
    g.closePath();
    g.fill();
  }
  function fog(g, w, y, hh, a) {
    const gr = g.createLinearGradient(0, y - hh, 0, y + hh);
    gr.addColorStop(0, 'rgba(190,200,200,0)');
    gr.addColorStop(0.5, `rgba(190,200,200,${a})`);
    gr.addColorStop(1, 'rgba(190,200,200,0)');
    g.fillStyle = gr;
    g.fillRect(0, y - hh, w, hh * 2);
  }
  function house(g, x, base, bw, bh, color, lit) {
    g.fillStyle = color;
    g.fillRect(x, base - bh, bw, bh);
    g.beginPath();
    g.moveTo(x - bw * 0.12, base - bh);
    g.lineTo(x + bw / 2, base - bh - bw * 0.32);
    g.lineTo(x + bw * 1.12, base - bh);
    g.closePath();
    g.fill();
    if (lit) {
      glow(g, x + bw * 0.5, base - bh * 0.55, bw * 0.7, lit, 0.55);
      g.fillStyle = lit;
      g.fillRect(x + bw * 0.38, base - bh * 0.7, bw * 0.24, bh * 0.28);
    }
  }
  function bell(g, x, y, s, color = '#b89a52') {
    g.strokeStyle = 'rgba(0,0,0,0.6)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(x, y - s * 2);
    g.lineTo(x, y - s * 0.8);
    g.stroke();
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(x - s * 0.9, y + s * 0.6);
    g.quadraticCurveTo(x - s * 0.8, y - s, x, y - s);
    g.quadraticCurveTo(x + s * 0.8, y - s, x + s * 0.9, y + s * 0.6);
    g.closePath();
    g.fill();
    glow(g, x - s * 0.2, y - s * 0.2, s * 2.2, 'rgba(230,200,120,0.35)');
  }
  function person(g, x, base, hh, color, hair) {
    g.fillStyle = color;
    const hw = hh * 0.13;
    g.beginPath();
    g.arc(x, base - hh + hw, hw, 0, Math.PI * 2);
    g.fill();
    g.beginPath();
    g.moveTo(x - hw * 1.1, base - hh + hw * 2.2);
    g.lineTo(x + hw * 1.1, base - hh + hw * 2.2);
    g.lineTo(x + hw * 1.6, base);
    g.lineTo(x - hw * 1.6, base);
    g.closePath();
    g.fill();
    if (hair) g.fillRect(x - hw, base - hh + hw, hw * 2, hh * 0.32);
  }
  function tree(g, x, base, hh, color) {
    g.fillStyle = color;
    g.fillRect(x - hh * 0.02, base - hh * 0.5, hh * 0.04, hh * 0.5);
    g.beginPath();
    g.moveTo(x, base - hh);
    g.lineTo(x + hh * 0.22, base - hh * 0.35);
    g.lineTo(x - hh * 0.22, base - hh * 0.35);
    g.closePath();
    g.fill();
  }
  function flames(g, cx, base, wid, hh, R) {
    glow(g, cx, base - hh * 0.4, wid * 1.6, 'rgba(255,140,40,0.55)');
    for (let i = 0; i < 26; i++) {
      const x = cx + (R() - 0.5) * wid, fh = hh * (0.3 + R() * 0.7), fw = wid * (0.05 + R() * 0.08);
      g.fillStyle = R() < 0.5 ? 'rgba(255,170,60,0.75)' : 'rgba(255,90,30,0.7)';
      g.beginPath();
      g.moveTo(x - fw, base);
      g.quadraticCurveTo(x - fw * 0.6, base - fh * 0.6, x + (R() - 0.5) * fw, base - fh);
      g.quadraticCurveTo(x + fw * 0.6, base - fh * 0.6, x + fw, base);
      g.closePath();
      g.fill();
    }
    for (let i = 0; i < 40; i++) {
      g.fillStyle = 'rgba(255,200,120,0.8)';
      g.fillRect(cx + (R() - 0.5) * wid * 1.6, base - hh - R() * hh, 1.5, 1.5);
    }
  }
  function village(g, w, h, R, lit) {
    const horizon = h * 0.46;
    vgrad(g, w, h, ['#0b1016', '#18222a', '#25303a'], 0, horizon);
    moon(g, w * 0.78, h * 0.12, Math.min(w, h) * 0.035);
    ridge(g, w, horizon - h * 0.06, h * 0.12, '#141b22', R);
    ridge(g, w, horizon, h * 0.05, '#0e1419', R);
    vgrad(g, w, h, ['#1b1d1c', '#0c0d0d'], horizon, h);
    // 两排房子往远处收
    for (let side = 0; side < 2; side++) {
      for (let i = 0; i < 6; i++) {
        const k = 1 - i * 0.14, bw = w * 0.2 * k, bh = h * 0.16 * k;
        const base = horizon + h * 0.32 * k * k;
        const x = side === 0 ? w * 0.5 - w * 0.06 - bw - w * 0.36 * k * k : w * 0.5 + w * 0.06 + w * 0.36 * k * k;
        const l = lit && R() < lit ? 'rgba(255,170,80,0.85)' : null;
        house(g, x, base, bw, bh, '#0d0f10', l);
        bell(g, side === 0 ? x + bw : x, base - bh * 0.9, Math.max(2, 5 * k));
      }
    }
    glow(g, w * 0.5, horizon - h * 0.01, h * 0.06, 'rgba(255,200,120,0.6)');
    g.fillStyle = 'rgba(255,215,150,0.9)';
    g.fillRect(w * 0.5 - 2, horizon - h * 0.015, 4, 4);
  }

  // ---- 场景 ----
  const S = {
    room(g, w, h, R) {
      vgrad(g, w, h, ['#08090a', '#111315', '#0a0b0c']);
      const ww = Math.min(w * 0.6, 360), wh = ww * 0.8, x = (w - ww) / 2, y = h * 0.1;
      const gr = g.createLinearGradient(0, y, 0, y + wh);
      gr.addColorStop(0, '#2b3a44');
      gr.addColorStop(1, '#45525a');
      g.fillStyle = gr;
      g.fillRect(x, y, ww, wh);
      g.save();
      g.beginPath();
      g.rect(x, y, ww, wh);
      g.clip();
      moon(g, x + ww * 0.75, y + wh * 0.25, ww * 0.06);
      ridge(g, w, y + wh * 0.75, wh * 0.2, '#1a2329', R, 6);
      person(g, x + ww * 0.3, y + wh * 1.05, wh * 0.45, '#0b0d0e', false);
      g.restore();
      g.fillStyle = '#1b1612';
      g.fillRect(x - 12, y - 12, ww + 24, 12);
      g.fillRect(x - 12, y + wh, ww + 24, 14);
      g.fillRect(x - 12, y, 12, wh);
      g.fillRect(x + ww, y, 12, wh);
      for (let i = 1; i <= 6; i++) {
        const bx = x + (ww / 7) * i;
        g.fillStyle = '#060606';
        g.fillRect(bx - 3, y, 6, wh);
        g.fillStyle = 'rgba(160,180,190,0.18)';
        g.fillRect(bx - 3, y, 1.5, wh);
      }
      glow(g, w / 2, y + wh + h * 0.12, ww, 'rgba(120,150,170,0.18)');
      g.strokeStyle = 'rgba(200,200,200,0.18)';
      g.lineWidth = 0.7;
      for (let i = 0; i < 7; i++) {
        g.beginPath();
        g.moveTo(0, 0);
        g.lineTo(Math.cos(i * 0.22) * 90, Math.sin(i * 0.22) * 90);
        g.stroke();
      }
      for (let r = 20; r < 90; r += 16) {
        g.beginPath();
        g.arc(0, 0, r, 0, Math.PI / 2 * 0.9);
        g.stroke();
      }
    },
    village(g, w, h, R) { village(g, w, h, R, 0.08); },
    alarm(g, w, h, R) {
      village(g, w, h, R, 0.9);
      for (let i = 0; i < 9; i++) person(g, w * (0.3 + R() * 0.4), h * (0.6 + R() * 0.25), h * (0.12 + R() * 0.06), '#070808', true);
      g.globalCompositeOperation = 'soft-light';
      g.fillStyle = 'rgba(200,40,30,0.5)';
      g.fillRect(0, 0, w, h);
      g.globalCompositeOperation = 'source-over';
    },
    cellar(g, w, h, R) {
      g.fillStyle = '#050505';
      g.fillRect(0, 0, w, h);
      g.save();
      g.globalAlpha = 0.5;
      const gr = g.createLinearGradient(w * 0.4, 0, w * 0.6, h * 0.6);
      gr.addColorStop(0, 'rgba(190,210,220,0.9)');
      gr.addColorStop(1, 'rgba(190,210,220,0)');
      g.fillStyle = gr;
      g.beginPath();
      g.moveTo(w * 0.42, 0);
      g.lineTo(w * 0.47, 0);
      g.lineTo(w * 0.7, h * 0.62);
      g.lineTo(w * 0.5, h * 0.62);
      g.closePath();
      g.fill();
      g.restore();
      for (let i = 0; i < 60; i++) {
        g.fillStyle = `rgba(220,220,210,${0.2 + R() * 0.5})`;
        g.fillRect(w * 0.45 + R() * w * 0.2, R() * h * 0.6, 1.2, 1.2);
      }
      g.fillStyle = 'rgba(150,170,180,0.25)';
      g.beginPath();
      g.ellipse(w * 0.44, h * 0.08, w * 0.05, h * 0.035, 0, 0, Math.PI * 2);
      g.fill();
    },
    shed(g, w, h, R) {
      vgrad(g, w, h, ['#16120e', '#0d0b09']);
      for (let x = 0; x < w; x += 22 + R() * 10) {
        g.fillStyle = `rgba(${60 + R() * 30},${45 + R() * 20},${30},0.5)`;
        g.fillRect(x, 0, 2, h);
      }
      const dw = Math.min(w * 0.42, 240), dx = (w - dw) / 2, dy = h * 0.12, dh = h * 0.42;
      g.fillStyle = '#030303';
      g.fillRect(dx, dy, dw, dh);
      for (let i = 0; i < 80; i++) {
        g.strokeStyle = `rgba(${150 + R() * 60},${120 + R() * 40},60,0.35)`;
        g.beginPath();
        const sx = dx + R() * dw, sy = dy + dh * (0.6 + R() * 0.4);
        g.moveTo(sx, sy);
        g.lineTo(sx + (R() - 0.5) * 30, sy - R() * 12);
        g.stroke();
      }
      g.fillStyle = '#2a2018';

    fire(g, w, h, R) {

      for (let i = 0; i < 18; i++) tree(g, R() * w, h * (0.5 + R() * 0.15), h * (0.3 + R() * 0.25), '#060707');
      for (let i = 0; i < 12; i++) {
        const t = i / 11, x = w * (0.15 + t * 0.7), y = h * (0.72 - t * 0.3);

})();

    $('cap').innerHTML = `No.${esc(v.id)}<b>${esc(v.title)}</b>`;
    const withYou = Object.keys(NAMES).filter((k) => S.w[k]).map((k) => `<span>${NAMES[k]}</span>`).join('');
    const wrist = { on: '红绳还在', burned: '红绳烧掉了', cut: '红绳剪断了' }[S.string];
    $('page').innerHTML = `
      <div class="with">同行 ${withYou || '<span>只有你</span>'}<span class="wrist">${wrist}</span></div>
      ${v.note ? `<div class="note">${paras(v.note)}</div>` : ''}
      <div class="txt">${paras(v.text)}</div>
      <div class="choices">${v.choices.map((c, i) => `<button class="choice" type="button" data-choose="${i}"><span class="k">${'ABCDEFG'[i]}</span><span>${esc(c)}</span></button>`).join('')}</div>`;
  }

  function renderDrawer() {
    const d = $('drawer');
    d.hidden = !drawerOpen || !S;
    if (d.hidden) return;
    d.innerHTML = `<div class="drawer-in">
      <h2>线索本 <button class="tool" type="button" data-clues>收起</button></h2>
      <p class="hint">一路上你记下的事。哪些重要、说明了什么，要你自己判断。</p>
      <ol>${S.clues.map((c) => `<li>${esc(ST.CLUES[c])}</li>`).join('')}</ol>
    </div>`;
  }

  function render() {
    if (!S) {
      $('start').hidden = false;
      $('game').hidden = true;
      $('drawer').hidden = true;
      $('album').innerHTML = albumHTML();
      document.querySelector('[data-resume]').hidden = true;
      paintBg('room');
      return;
    }
    $('start').hidden = true;
    $('game').hidden = false;
    paintBg(ST.bgOf(S));
    renderHud();
    renderPage();
    renderDrawer();
    store.set(KEY.auto, JSON.stringify(S));
  }

  function top() { window.scrollTo({ top: 0, behavior: 'auto' }); }

  let armed = false;
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;
    if ('new' in d) {
      if (S && !S.ending && !armed && b.closest('#start') === null) {
        armed = true;
        b.textContent = '再点一次，重新开始';
        setTimeout(() => { armed = false; }, 3000);
        return;
      }
      armed = false;
      S = ST.newGame();
      drawerOpen = false;
      top();
    } else if ('resume' in d) {
      // 由 start() 设置 S，这里只渲染
    } else if (!S) return;
    else if ('choose' in d) {
      ST.choose(S, Number(d.choose));
      if (S.dinged) Sound.ding(S.alarm >= 3 ? 3 : 1);
      top();
    } else if ('undo' in d) { S = ST.undo(S); top(); }
    else if ('clues' in d) drawerOpen = !drawerOpen;
    else if ('mute' in d) Sound.toggle();
    else return;
    render();
  });

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { const k = painted; painted = ''; paintBg(k || 'room'); }, 200);
  });

  function start(data) {
    if (data && data.S) S = data.S;
    else {
      try { const x = JSON.parse(store.get(KEY.auto) || 'null'); S = x && x.v === 1 && x.node ? x : null; } catch { S = null; }
    }
    render();
  }
  window.claude?.hot?.snapshot?.(() => ({ S }));
  if (window.claude?.hot?.ready) window.claude.hot.ready(start);
  else start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
